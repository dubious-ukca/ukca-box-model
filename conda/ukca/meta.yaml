{% set version = "0.1.0" %}

package:
  name: ukca
  version: {{ version }}

source:
  path: ../..

build:
  number: 0

requirements:
  build:
    - gfortran==14.3.0
    - gcc==14.3.0
    - cmake
    - ninja
  host: []
  run: []

test:
  commands:
    - test -f "${PREFIX}/lib/libukca_standalone.a"
    - test -d "${PREFIX}/include/ukca/mod"

about:
  summary: Standalone UKCA Fortran library and module files
  home: https://github.com/RobWatersMet/ukca_box_model
  license: BSD-3-Clause

extra:
  recipe-maintainers:
    - RobWatersMet
